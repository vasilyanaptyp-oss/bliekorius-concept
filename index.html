<!DOCTYPE html>
<!-- СКЕЛЕТ. Плейсхолдеры Bliekorius  lt +370 … bliekorius заполняет new-site.py из seo.md/brief.md -->
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO из seo.md -->
  <title>Bliekorius</title>
  <meta name="description" content="">

  <!-- NOINDEX-ПЕРЕКЛЮЧАТЕЛЬ.
       Концепт (GitHub Pages): строка ниже активна — поисковики не индексируют.
       Полная версия на домене клиента: удалить noindex и раскомментировать canonical. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- <link rel="canonical" href="https://bliekorius.lt/"> -->

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bliekorius">
  <meta property="og:description" content="">
  <meta property="og:image" content="og.jpg">
  <meta property="og:locale" content="lt_LT">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Шрифты: свои копии, latin + latin-ext (+ cyrillic если ru).
       Прежде чем выбирать — glyphcheck.py; после fontfetch — проверить cmap каждого файла. -->
  <link rel="preload" href="fonts/display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/text.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Метрические fallback (size-adjust) обязательны — иначе CLS. Значения мерить DOM-шириной образца. */
    @font-face {
      font-family: "DisplayFallback";
      src: local("Arial");
      size-adjust: 100%; /* подобрать */
    }
    @font-face {
      font-family: "TextFallback";
      src: local("Arial");
      size-adjust: 100%; /* подобрать */
    }

    :root {
      /* Палитра — своя на каждый сайт, не из реестра */
      --bg: #ffffff;
      --ink: #1a1a1a;
      --ink-2: #555555; /* приглушение ЦВЕТОМ, не opacity — иначе axe color-contrast */
      --accent: #000000;
      --pad: clamp(16px, 4vw, 48px);
      --font-display: "Display", "DisplayFallback", sans-serif;
      --font-text: "Text", "TextFallback", sans-serif;
    }

    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text);
      line-height: 1.6;
    }
    h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; }

    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    /* Если на ярлыке есть clip-path:  a:focus-visible { clip-path: none; } */

    /* GSAP выключает CSS-transitions, чтобы не было «неподвижной» анимации */
    html.gs *, html.gs *::before, html.gs *::after {
      transition: none !important;
      animation: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <!-- Первый экран: свой скелет на каждый сайт (сверяться с _design-registry.md) -->
  <header>
    <h1>Bliekorius</h1>
    <p></p>
    <a class="btn" href="tel:tel:+37000000000">+370 …</a>
  </header>

  <main>
    <!-- Слоты JSON-LD из schema.json (контент-редактор): вставить перед </body> -->
  </main>

  <footer>
    <p>© 2026 Bliekorius</p>
  </footer>

  <!-- Нижняя панель «Skambinti»: чистый HTML+CSS, работает без JS и без CDN.
       Прячется, когда номер уже в зоне видимости, классом из ui.js. -->
  <nav class="callbar" aria-label="Greitas skambutis">
    <a class="callbar__btn" href="tel:tel:+37000000000">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>Skambinti</span>
    </a>
  </nav>
  <style>
    .callbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: center;
      padding: 10px calc(var(--pad) / 2) max(10px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .callbar__btn {
      pointer-events: auto;
      display: inline-flex; align-items: center; gap: 10px;
      min-height: 48px; padding: 12px 28px;
      background: var(--accent); color: var(--bg);
      border-radius: 999px; text-decoration: none; font-weight: 600;
    }
  </style>

  <!-- ui.js: логика звонка/записи/языка — СИНХРОННО, не ждёт CDN и GSAP -->
  <script src="ui.js"></script>

  <!-- GSAP локально из vendor/, подключение после загрузки -->
  <script>
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.src = 'vendor/gsap.min.js';
      s.onload = function () {
        document.documentElement.classList.add('gs');
        var st = document.createElement('script');
        st.src = 'vendor/ScrollTrigger.min.js';
        st.onload = function () {
          if (window.gsap && window.ScrollTrigger) {
            gsap.registerPlugin(ScrollTrigger);
            var m = document.createElement('script');
            m.src = 'main.js'; // вся анимация здесь; при reduced-motion — выход сразу
            document.body.appendChild(m);
          }
        };
        document.body.appendChild(st);
      };
      document.head.appendChild(s);
    });
  </script>
</body>
</html>
